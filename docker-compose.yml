###############################################
# LOCAL AI STACK — USER TUTORIAL
###############################################
#
# This Docker Compose stack provides:
#
#   • PostgreSQL + pgvector  → vector database
#   • pgAdmin               → database UI
#   • Ollama                → local LLM runtime
#   • Ollama init container → auto‑pulls models
#   • (Optional) Open‑WebUI → web interface
#
# All services run on the same internal Docker
# network ("localnet") and communicate using
# service names (no localhost inside Docker).
#
###############################################

version: "3.9"

###############################################
# SERVICES
###############################################
services:

  ################################################
  # PostgreSQL with pgvector extension
  ################################################
  #
  # Purpose:
  #   Central vector database for embeddings
  #   (RAG, semantic search, memory, etc.)
  #
  # Notes:
  #   - pgvector support is built into the image
  #   - Data is persisted in pgvector_data volume
  #
  # Host access (optional):
  #   Host:     localhost
  #   Port:     5555
  #   User:     postgres
  #   Password: postgres
  #
  ################################################
  pgvector:
    image: ankane/pgvector:latest
    container_name: pgvector_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5555:5432"        # Host access (optional)
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d   # Mount initial db-files
    networks:
      - localnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5


  ################################################
  # pgAdmin — PostgreSQL Web UI
  ################################################
  #
  # Purpose:
  #   Visual management of PostgreSQL
  #
  # Access:
  #   http://localhost:5050
  #
  # Default login:
  #   Email:    admin@admin.com
  #   Password: admin
  #
  # IMPORTANT (internal connection):
  #   Host name/address: pgvector
  #   Port: 5432
  #
  # Explanation:
  #   Because pgAdmin and PostgreSQL are on the
  #   same Docker network, Docker DNS resolves
  #   the service name automatically.
  #
  ################################################
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_ui
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - pgvector
    networks:
      - localnet


  ################################################
  # Ollama — Local LLM Runtime
  ################################################
  #
  # Purpose:
  #   Runs LLMs and embedding models locally
  #
  # Access:
  #   From host:        http://localhost:11434
  #   From containers: http://ollama:11434
  #
  # Notes:
  #   - Models are stored in ollama_models volume
  #   - API is HTTP + JSON
  #
  ################################################
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_local
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - localnet


  ################################################
  # Ollama Init Container — MODEL BOOTSTRAP
  ################################################
  #
  # Purpose:
  #   Automatically downloads required models
  #   ONCE, then exits.
  #
  # How it works:
  #   1. Waits for Ollama to start
  #   2. Pulls required models
  #   3. Stores them in shared volume
  #   4. Exits permanently
  #
  # This container:
  #   - Runs only once
  #   - Is safe to leave defined
  #   - Will NOT re‑pull models unnecessarily
  #
  # # LLM:
  #   smollm:360m -> small model, for local environment
  #
  # # Embedding model:
  #   mxbai-embed-large
  #   → Embedding dimension: 1024
  ################################################
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama_model_init
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command: >
      sleep 10 &&
      ollama pull smollm:360m &&
      ollama pull mxbai-embed-large
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - localnet
    restart: "no"


  ################################################
  # Open‑WebUI — Optional Web Interface
  ################################################
  #
  # Purpose:
  #   Browser-based UI for chatting with LLMs
  #
  # Access:
  #   http://localhost:3000
  #
  # Internal networking:
  #   Uses Docker DNS to connect to Ollama:
  #     http://ollama:11434
  #
  # Notes:
  #   - No localhost inside containers!
  #   - Data stored in open-webui volume
  #
  ################################################
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: always
    ports:
      - "3000:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - ollama
    networks:
      - localnet

###############################################
# VOLUMES — DATA PERSISTENCE
###############################################
#
# These volumes survive restarts and upgrades:
#
#   pgvector_data  → PostgreSQL database
#   pgadmin_data   → pgAdmin config
#   ollama_models  → LLM & embedding models
#   open-webui     → chats, users, settings
#
###############################################
volumes:
  pgvector_data:
  pgadmin_data:
  ollama_models:
  open-webui:

###############################################
# NETWORK — INTERNAL COMMUNICATION
###############################################
#
# All services share ONE internal network.
#
# Service DNS names:
#   pgvector → pgvector:5432
#   pgAdmin  → pgadmin:80
#   Ollama   → ollama:11434
#   WebUI    → open-webui:8080
#
###############################################
networks:
  localnet:
    driver: bridge
